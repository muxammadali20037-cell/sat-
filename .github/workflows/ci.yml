name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Content checks (study guides, question packs)
        run: |
          npx tsx scripts/guides/build.ts --check
          for pack in content/question-packs/*/; do
            if [ -d "$pack" ]; then npx tsx scripts/question-packs/check.ts "$(basename "$pack")"; fi
          done

      - name: Database (PostgreSQL from the runner image)
        run: |
          export PG_BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          echo "Using $PG_BIN"
          scripts/db/test-db.sh start
          scripts/db/test-db.sh reset --seed
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54329 -U postgres -d satmaster_test -f scripts/db/check-seed.sql

      - name: Database tests (RLS, billing, practice, exams, guides)
        env:
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:54329/satmaster_test
        run: npm run test:db

      - name: Production build
        run: npm run build
